<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021024" />
      <stop offset="100%" stop-color="#051937" />
    </linearGradient>
    
    <!-- Neon Cyan Glow Filter -->
    <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Badge with High-Contrast Border -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="#00E5FF" stroke-width="2.5" stroke-opacity="0.9" />

  <!-- High-Tech Scanner Target Reticles (4 corners) -->
  <path d="M10 22V12H20" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" />
  <path d="M54 22V12H44" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" />
  <path d="M10 42V52H20" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" />
  <path d="M54 42V52H44" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" />

  <!-- Barcode / Optical Digital Blocks (Futuristic Scan Code) -->
  <line x1="22" y1="20" x2="22" y2="44" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
  <line x1="28" y1="20" x2="28" y2="44" stroke="#00E5FF" stroke-width="2" stroke-linecap="round" />
  <line x1="33" y1="20" x2="33" y2="44" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" />
  <line x1="39" y1="20" x2="39" y2="44" stroke="#00E5FF" stroke-width="2" stroke-linecap="round" />
  <line x1="43" y1="20" x2="43" y2="44" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />

  <!-- Neon Laser Beam Passing Through the Center -->
  <!-- Outer Glow -->
  <line x1="6" y1="32" x2="58" y2="32" stroke="#00F0FF" stroke-width="4.5" stroke-linecap="round" filter="url(#laserGlow)" opacity="0.9" />
  <!-- Intense White-Hot Core Beam -->
  <line x1="8" y1="32" x2="56" y2="32" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
  
  <!-- Optical Target Center Dot -->
  <circle cx="32" cy="32" r="3.5" fill="#FFFFFF" />
  <circle cx="32" cy="32" r="5" stroke="#00F0FF" stroke-width="1.5" />
</svg>
