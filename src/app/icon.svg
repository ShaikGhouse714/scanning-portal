<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Bar 1 Gradient: Electric Cyan to Blue -->
    <linearGradient id="bar1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00A3FF" />
      <stop offset="100%" stop-color="#0057FF" />
    </linearGradient>

    <!-- Bar 2 Gradient: Blue-Purple to Indigo -->
    <linearGradient id="bar2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6E44FF" />
      <stop offset="100%" stop-color="#4B22EB" />
    </linearGradient>

    <!-- Bar 3 Gradient: Electric Indigo to Vivid Violet -->
    <linearGradient id="bar3Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9E00FF" />
      <stop offset="100%" stop-color="#7300E6" />
    </linearGradient>

    <!-- Subtle Glow Filter for modern pop -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#7000FF" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#softGlow)">
    <!-- Bar 1: Shorter Left Bar -->
    <rect x="13" y="34" width="10" height="22" rx="5" fill="url(#bar1Grad)" />
    
    <!-- Bar 2: Medium Middle Bar -->
    <rect x="27" y="22" width="10" height="34" rx="5" fill="url(#bar2Grad)" />
    
    <!-- Bar 3: Tallest Right Bar -->
    <rect x="41" y="10" width="10" height="46" rx="5" fill="url(#bar3Grad)" />
  </g>
</svg>
