<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded Squircle Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#121214" stroke="#27272A" stroke-width="2" />
  
  <!-- Bar 1: Shorter Left Bar (White) -->
  <rect x="16" y="32" width="8" height="18" rx="4" fill="#FFFFFF" />
  
  <!-- Bar 2: Medium Middle Bar (Silver/Gray) -->
  <rect x="28" y="22" width="8" height="28" rx="4" fill="#A1A1AA" />
  
  <!-- Bar 3: Tallest Right Bar (Dark Slate) -->
  <rect x="40" y="14" width="8" height="36" rx="4" fill="#52525B" />
</svg>
